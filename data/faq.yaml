- q: "C'est vraiment gratuit ?"
  r: "Oui. Pas d'abonnement, pas de compte, pas de publicité. L'outil fonctionne entièrement dans votre navigateur."
- q: "Où sont stockées mes informations ?"
  r: "Nulle part chez nous : **aucune donnée n'est envoyée sur un serveur**. Les informations du bail sont rangées dans le lien de votre rappel d'agenda, après le signe « # », une partie de l'adresse qui n'est jamais transmise au site. Le PDF est fabriqué sur votre appareil."
- q: "La quittance part-elle toute seule au locataire ?"
  r: "Non, jamais. Vous générez la quittance quand vous avez bien reçu le loyer, puis vous l'envoyez vous-même : PDF à joindre, e-mail pré-rédigé, ou partage direct depuis le téléphone."
- q: "Et si le locataire ne paie qu'une partie ?"
  r: "Un geste suffit pour passer en **reçu de paiement partiel** : la somme versée et le reste dû y figurent. Une quittance ne se délivre que pour un paiement complet."
- q: "Avec quels agendas ça marche ?"
  r: "Google Agenda, Calendrier de l'iPhone et du Mac, Outlook, et tous les agendas qui lisent le format standard .ics."
- q: "J'ai plusieurs logements."
  r: "Configurez chaque bail, et ajoutez son agenda : chaque rappel a son propre lien, vers la bonne quittance."
