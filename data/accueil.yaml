a01: "<span class=\"point\"></span>Gratuit · Sans compte · Pour les bailleurs"
a02: "Vos quittances de loyer, <em>chaque mois en un&nbsp;clic.</em>"
a03: "Renseignez le bail une fois, ajoutez les rappels à votre agenda. Le jour du loyer, un clic sur le rappel prépare la quittance en PDF, prête à envoyer."
a04: "Créer mes quittances"
a05: "Agenda · 09:00"
a06: "Loyer de Camille — quittance à générer"
a07: "En une minute"
a08: "Regardez comment ça marche"
a09: "téléchargez-la"
a10: "Trois étapes, une seule fois"
a11: "Configurez une fois.<br>Cliquez chaque mois."
a12: "Renseignez le bail"
a13: "Bailleur, locataire, adresse du logement, loyer et charges, jour du paiement. Vide, meublé ou colocation. L'aperçu de la quittance se met à jour pendant que vous tapez."
a14: "Ajoutez les rappels à votre agenda"
a15: "Le jour même, la veille, trois jours ou une semaine avant : vous choisissez. Un fichier .ics s'ajoute à Google Agenda, à l'iPhone ou à Outlook. En option : un rappel « loyer bien arrivé ? » et la révision annuelle du loyer."
a16: "Chaque mois, un clic sur le rappel"
a17: "Le loyer est arrivé ? Touchez le lien du rappel : la quittance du mois s'ouvre, déjà remplie, avec la bonne période. Téléchargez le PDF, ou partagez-le directement au locataire."
a18: "<span class=\"point\"></span>Message n° 1"
a19: "Aucune donnée n'est envoyée sur un serveur."
a20: "Pas de compte à créer, pas de base de données, pas de cloud. Les noms, les adresses et les montants ne quittent jamais votre appareil."
a21: "Les informations du bail sont rangées dans le lien de votre rappel, après le « # » : cette partie d'une adresse web n'est <strong>jamais transmise</strong> au site."
a22: "Le PDF est fabriqué sur votre téléphone ou votre ordinateur."
a23: "Aucun cookie, aucune mesure d'audience, aucun traceur."
a24: "La quittance ne part jamais toute seule : c'est vous qui l'envoyez."
a25: "Votre appareil"
a26: "bail · quittances · PDF"
a27: "Serveur"
a28: "rien du tout"
a29: "Tout ce qu'il faut, rien de plus"
a30: "Pensé pour les bailleurs pressés"
a31: "Une quittance en règle"
a32: "Loyer et charges séparés, période, date du paiement, montant en lettres, mention de gratuité."
a33: "Reçu si paiement partiel"
a34: "Une bascule, et le document devient un reçu : somme versée, total dû, reste dû."
a35: "Fins de mois gérées"
a36: "Loyer le 30 ou le 31 ? Dernier jour du mois ou le 28, au choix. Mensuel, trimestriel ou annuel."
a37: "Révision IRL"
a38: "Un rappel annuel, et le montant se corrige d'un clic dans la page de la quittance."
a39: "Envoi en un geste"
a40: "PDF bien nommé, e-mail pré-rédigé, ou partage direct depuis le téléphone."
a41: "Signature au doigt"
a42: "Signez une fois ; la signature peut rester mémorisée sur votre appareil, seulement."
a43: "Le bon document, à chaque fois"
a44: "Quittance ou reçu ?"
a45: "Une quittance atteste d'un paiement <strong>intégral</strong>. En cas de paiement partiel, la loi prévoit un <strong>reçu</strong>. Quittance Tranquille vous évite l'erreur."
