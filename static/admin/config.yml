          - { name: pied04, label: "A · Vos données", widget: string }
          - { name: pied05, label: "A · Essayer gratuitement", widget: string, hint: "Les balises <…> font la mise en forme : les garder." }
          - { name: pied06, label: "P · Vos quittances de loyer, chaque mois en un clic. Gratuit, sans compte.…", widget: text, hint: "Les balises <…> font la mise en forme : les garder." }
