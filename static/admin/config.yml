          - { name: a50, label: "SPAN · Somme versée 400,00 €", widget: string }
          - { name: a51, label: "H2 · Questions fréquentes", widget: string }
          - { name: a52, label: "H2 · Votre prochaine quittance est à une minute.", widget: string }
