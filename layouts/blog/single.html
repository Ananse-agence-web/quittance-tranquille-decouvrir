{{ define "main" }}
<article class="article">
  <div class="etroit">
    <p><small>{{ .Date | time.Format "2 January 2006" }}</small></p>
    <h1>{{ .Title }}</h1>
    {{ with .Params.image }}<p><img src="{{ . | relURL }}" alt=""></p>{{ end }}
    {{ .Content }}
    <p><a href="{{ "blog/" | relURL }}">← Tous les articles</a></p>
  </div>
</article>
{{ end }}
